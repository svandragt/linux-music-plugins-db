<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — unofficial tracker</title>
<style>
  :root {
    --bg: #0e1210;
    --bg-raised: #141a17;
    --line: #263029;
    --text: #d3dbd4;
    --text-dim: #7c8a80;
    --green: #6fcf97;
    --amber: #e0b558;
    --red: #d9736a;
    --mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.5;
    padding: 0 0 80px;
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 56px 24px 0;
  }

  h1 {
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 12px;
    color: #f0f4f0;
    letter-spacing: -0.01em;
  }

  h1 + .tag {
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0 0 18px;
  }

  .tag em { font-style: normal; }

  h2 {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 500;
    margin: 40px 0 12px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
  }

  p {
    color: var(--text-dim);
    max-width: 640px;
    font-size: 14px;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
    font-size: 13px;
    color: var(--text-dim);
  }

  ul li { margin: 0 0 6px; }

  ul li strong {
    color: var(--text);
    font-weight: 600;
  }

  a {
    color: var(--amber);
    text-decoration: none;
    border-bottom: 1px solid rgba(224, 181, 88, 0.3);
  }

  a:hover { border-bottom-color: var(--amber); }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    font-size: 13.5px;
  }

  thead th {
    text-align: left;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 0 16px 12px 0;
    border-bottom: 1px solid var(--line);
    font-weight: 500;
  }

  tbody tr { border-bottom: 1px solid var(--line); }

  tbody tr:hover { background: var(--bg-raised); }

  td {
    padding: 14px 16px 14px 0;
    vertical-align: top;
    color: var(--text-dim);
    font-size: 12.5px;
  }

  tbody td:first-child {
    color: #f0f4f0;
    font-weight: 500;
    font-size: 13.5px;
    white-space: nowrap;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .dot.yes { background: var(--green); }
  .dot.no { background: var(--text-dim); }
  .dot.broken { background: var(--red); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    border-radius: 3px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  .badge.yes {
    background: rgba(111, 207, 151, 0.12);
    color: var(--green);
  }

  .badge.no {
    background: rgba(124, 138, 128, 0.12);
    color: var(--text-dim);
  }

  .badge.broken {
    background: rgba(217, 115, 106, 0.12);
    color: var(--red);
  }

  code {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 12.5px;
  }

  footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 12.5px;
    line-height: 1.7;
  }

  @media (max-width: 640px) {
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tbody tr { padding: 14px 0; }
    td { padding: 3px 0; white-space: normal; }
    tbody td:first-child { font-size: 15px; margin-bottom: 4px; }
  }
</style>
</head>
<body>
  <div class="wrap">
{{CONTENT}}
    <footer>
      Rendered from <a href="https://github.com/svandragt/linux-music-plugins-db">markdown in the repository</a> — corrections welcome as pull requests.
    </footer>
  </div>
</body>
</html>
