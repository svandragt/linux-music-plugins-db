server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Note: add_header in a location block replaces (not extends) these, so keep
    # all response headers at server level unless a location repeats them.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Cache-Control "public, max-age=300" always;

    gzip on;
    gzip_types text/html text/css;
    gzip_min_length 512;

    location / {
        # No SPA fallback: a wrong URL should 404, not serve the index under it.
        try_files $uri $uri.html $uri/ =404;
    }
}
